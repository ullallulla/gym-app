services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: gym_app
      POSTGRES_USER: gym_app
      POSTGRES_PASSWORD: gym_app_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gym_app", "-d", "gym_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
